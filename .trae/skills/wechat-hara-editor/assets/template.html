<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Hara Style Template</title>
    <style>
        /* 
         * Kenya Hara Style Guide
         * Philosophy: Information Priority, Breathing Space, Tactility
         */
        
        :root {
            --text-color: #1a1a1a;       /* 近似纯黑，略带温润 */
            --bg-color: #ffffff;         /* 纯白 */
            --accent-color: #7f7f7f;     /* 中性灰，用于次要信息 */
            --highlight-color: #a61c00;  /* 类似 MUJI 红，仅极少量用于强调 */
            --code-bg: #f5f5f5;          /* 极淡灰 */
            --font-main: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            --font-mono: "Menlo", "Monaco", "Consolas", "Courier New", monospace;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-color);
            background-color: var(--bg-color);
            line-height: 1.8;
            font-size: 16px;
            letter-spacing: 0.05em;
            margin: 0;
            padding: 20px;
            max-width: 677px; /* 微信公众号常见宽度限制 */
            margin: 0 auto;
            text-align: justify; /* 两端对齐，增加秩序感 */
        }

        /* 留白：构建呼吸感 */
        section {
            margin-bottom: 40px;
        }

        /* 标题体系：克制而有力 */
        h1 {
            font-size: 24px;
            font-weight: 600;
            line-height: 1.4;
            margin-top: 60px;
            margin-bottom: 30px;
            letter-spacing: 0.1em;
            border-bottom: 1px solid #000; /* 极简分割 */
            padding-bottom: 10px;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-top: 40px;
            margin-bottom: 20px;
            position: relative;
            padding-left: 12px;
        }

        h2::before {
            content: '';
            position: absolute;
            left: 0;
            top: 6px;
            bottom: 6px;
            width: 4px;
            background-color: #000; /* 黑色方块指引 */
        }

        h3 {
            font-size: 17px;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 15px;
            color: #333;
        }

        /* 正文：清晰易读 */
        p {
            margin-bottom: 20px;
            text-align: justify;
        }

        strong {
            font-weight: 600;
            color: #000;
        }

        em {
            font-style: normal;
            color: var(--accent-color);
            font-size: 0.95em;
        }

        /* 列表：几何秩序 */
        ul, ol {
            padding-left: 20px;
            margin-bottom: 20px;
        }

        li {
            margin-bottom: 10px;
            padding-left: 5px;
        }

        /* 引用：内省空间 */
        blockquote {
            margin: 30px 0;
            padding: 20px;
            background-color: #fafafa;
            border-left: none; /* 去除传统边框 */
            color: #555;
            font-size: 0.95em;
            position: relative;
        }
        
        blockquote::before {
            content: '“';
            font-size: 40px;
            color: #e0e0e0;
            position: absolute;
            top: -10px;
            left: 10px;
            font-family: serif;
        }

        /* 代码块：技术与人文的融合 */
        pre {
            background-color: var(--code-bg);
            padding: 15px;
            border-radius: 0; /* 直角，拒绝圆滑 */
            overflow-x: auto;
            margin: 20px 0;
            border: 1px solid #eee;
        }

        code {
            font-family: var(--font-mono);
            font-size: 14px;
            color: #444;
        }
        
        /* 链接：低调的连接 */
        a {
            color: var(--text-color);
            text-decoration: none;
            border-bottom: 1px solid #ccc;
            transition: border-color 0.2s;
        }
        
        a:hover {
            border-bottom-color: #000;
        }

        /* 分割线：无形之形 */
        hr {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 60px 0;
        }
        
        /* Checkbox list special styling */
        li.task-list-item {
            list-style-type: none;
            margin-left: -20px;
        }
        
        input[type="checkbox"] {
            margin-right: 10px;
            vertical-align: middle;
        }

    </style>
</head>
<body>
    {{content}}
</body>
</html>
