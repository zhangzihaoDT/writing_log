    <style>
      body {
        font-family: 'Courier New', monospace;
        background-color: #0d0d0d;
        color: #32d583;
        padding: 40px;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        color: #7f56d9;
        margin-bottom: 30px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
        justify-content: center;
      }
      .card {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 4px;
        overflow: hidden;
        width: 360px;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 0 15px rgba(127, 86, 217, 0.4);
        border-color: #7f56d9;
      }
      .image-container {
        width: 100%;
        padding-bottom: 133.33%; /* 3:4 aspect ratio */
        position: relative;
        background-color: #000;
      }
      .image-container img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .info {
        padding: 20px;
      }
      .info h3 {
        margin: 0 0 10px 0;
        font-size: 18px;
        color: #fff;
      }
      .info p {
        margin: 0;
        color: #888;
        font-size: 12px;
        margin-bottom: 15px;
      }
      .download-btn {
        display: block;
        width: 100%;
        padding: 10px 0;
        background-color: transparent;
        color: #32d583;
        text-align: center;
        text-decoration: none;
        border: 1px solid #32d583;
        border-radius: 2px;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s;
      }
      .download-btn:hover {
        background-color: #32d583;
        color: #0d0d0d;
      }
    </style>
